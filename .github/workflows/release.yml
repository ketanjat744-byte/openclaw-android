name: Build Release APK

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Check Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools"

      - name: Fetch prebuilt Node.js libs
        run: |
          chmod +x scripts/fetch-node-libs.sh
          ./scripts/fetch-node-libs.sh

      - name: Create local.properties
        run: |
          cp local.properties.example local.properties || true
          grep -q '^sdk.dir' local.properties \
            && sed -i "s|^sdk.dir=.*|sdk.dir=$ANDROID_HOME|" local.properties \
            || echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Build release APK (unsigned)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEY_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            echo "KS_PASS=$KEY_PASS" >> $GITHUB_ENV
            echo "KS_ALIAS=${{ secrets.KEY_ALIAS || 'key0' }}" >> $GITHUB_ENV
          else
            echo "Secrets nahi mile, temporary keystore bana raha hoon"
            keytool -genkeypair -v -keystore release.jks -alias key0 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass temp12345 -keypass temp12345 \
              -dname "CN=Local Build"
            echo "KS_PASS=temp12345" >> $GITHUB_ENV
            echo "KS_ALIAS=key0" >> $GITHUB_ENV
          fi

      - name: Zipalign and sign
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(find . -path "*build/outputs/apk/release*" -name "*.apk" | head -1)
          echo "Found: $APK"
          mkdir -p out
          $BT/zipalign -f -p 4 "$APK" out/aligned.apk
          $BT/apksigner sign --ks release.jks \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass pass:$KS_PASS --key-pass pass:$KS_PASS \
            --out out/app-release-signed.apk out/aligned.apk
          $BT/apksigner verify out/app-release-signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: out/app-release-signed.apk
