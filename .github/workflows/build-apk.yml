name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fetch prebuilt Node.js libs
        run: |
          chmod +x scripts/fetch-node-libs.sh
          ./scripts/fetch-node-libs.sh

      - name: Create local.properties
        run: |
          cp local.properties.example local.properties || true
          grep -q '^sdk.dir' local.properties \
            && sed -i "s|^sdk.dir=.*|sdk.dir=$ANDROID_HOME|" local.properties \
            || echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: "**/build/outputs/apk/**/*.apk"
